<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicons/favicon-16x16.png">
    <link rel="stylesheet" href="css/style.css">
    <title>Pokédex</title>
</head>
<body>

    <main>

        <img src="" alt="" class="pokemon_img">

        <h1 class="pokemon_data">
            <span class="pokemon_number">6</span> -
            <span class="pokemon_name">Charizard</span>
        </h1>

        <form action="">
            <input 
            type="search"
            class="input_search"
            placeholder="Name or number"
            required
            >

        </form>

        <img src="images/pokedex.png" alt="pokedex" class="pokedex">

    </main>
    
</body>
</html>
